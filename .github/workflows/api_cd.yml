name: Api CD

on:
  push:
    branches:
      - main
    paths:
      - "backoffice/**"
      - ".github/workflows/**"
    

  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, push and deploy API
    runs-on: ubuntu-latest

    environment:
      name: staging

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle

      - name: Build backend layers
        working-directory: .
        run: |
          chmod +x ./backoffice/gradlew
          make build

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/weilaizr/qresto-backoffice_backend:latest
          context: ./backoffice
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: ./.github/actions/deploy
        with:
          token_github: ${{ secrets.GITHUB_TOKEN }}
          server_ip: ${{ secrets.SERVER_IP }}
          server_user: ${{ secrets.SERVER_USER }}
          secret_key: ${{ secrets.SSH_KEY_VPS }}
          image: ghcr.io/weilaizr/qresto-backoffice_backend:latest
          db_username: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          db_password: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}